# 매일 09:07(KST) 나스닥 방향성 계산 → 카카오톡 발송 → 차트 페이지·기록 커밋(→ Vercel 자동 배포)
name: daily

on:
  schedule:
    - cron: "7 0 * * *"        # 00:07 UTC = 09:07 KST (정각 혼잡을 피해 7분)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "발송 없이 실행 (차트 페이지만 갱신)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Run
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_TOKEN_KEY: ${{ secrets.KAKAO_TOKEN_KEY }}
        run: python -m nasdaq_signal.main ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html model/
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "chore: daily update $(TZ=Asia/Seoul date +%F)"
          git pull --rebase
          git push

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: state/logs
          retention-days: 14
          if-no-files-found: ignore
