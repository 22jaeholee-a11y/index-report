horizons:
  short: {days: 10,  up: 0.015, down: -0.015}
  mid:   {days: 63,  up: 0.04,  down: -0.04}
  long:  {days: 252, up: 0.08,  down: -0.08, predict: false}   # 2008 포함 검증에서 안정적 예측 지표 없음 → 역사적 평균만 표시
category_weights:          # 카테고리 × 기간, 기간별 합 = 1
  market:    {short: 0.45, mid: 0.30, long: 0.15}
  sentiment: {short: 0.30, mid: 0.20, long: 0.10}
  geo:       {short: 0.10, mid: 0.15, long: 0.15}
  macro:     {short: 0.15, mid: 0.35, long: 0.60}
indicators:                # transform: percentile | contrarian ; direction: +1/-1
  trend_50:     {category: market, transform: percentile, direction: 1}
  trend_200:    {category: market, transform: percentile, direction: 1}
  ret_20:       {category: market, transform: percentile, direction: 1}
  ret_60:       {category: market, transform: percentile, direction: 1}
  drawdown_52w: {category: market, transform: percentile, direction: 1}
  breadth:      {category: market, transform: percentile, direction: 1}
  vix:          {category: sentiment, transform: percentile, direction: -1,
                 horizons: {mid: {transform: contrarian}, long: {transform: contrarian}}}
  vix_term:     {category: sentiment, transform: percentile, direction: -1}
  gpr:          {category: geo, transform: percentile, direction: -1,   # 지정학: 2018~ 검증에서 반대로 작동 → 점수 제외(기록만)
                 horizons: {short: {exclude: true}, mid: {exclude: true}, long: {exclude: true}}}
  oil_ret_20:   {category: geo, transform: percentile, direction: -1,
                 horizons: {short: {exclude: true}, mid: {exclude: true}, long: {exclude: true}}}
  gold_ret_20:  {category: geo, transform: percentile, direction: -1,
                 horizons: {short: {exclude: true}, mid: {exclude: true}, long: {exclude: true}}}
  us10y_chg_20: {category: macro, transform: percentile, direction: -1}
  us2y_chg_20:  {category: macro, transform: percentile, direction: -1}   # 2년물 20일 변화 (금리 인상 기대)
  breakeven_chg_20: {category: macro, transform: percentile, direction: -1}   # 기대인플레이션 20일 변화 (물가 우려)
  curve:        {category: macro, transform: percentile, direction: 1}
  credit:       {category: macro, transform: percentile, direction: 1}   # HYG/IEF 60일 변화 (신용 위험선호)
  dxy_ret_60:   {category: macro, transform: percentile, direction: -1}
  nfci:         {category: macro, transform: percentile, direction: -1,   # 2008 위기 구간 역작동 → 점수 제외(기록만)
                 horizons: {short: {exclude: true}, mid: {exclude: true}, long: {exclude: true}}}
  sahm:         {category: macro, transform: percentile, direction: -1,   # 2008년 내내 최대 매수 신호 → 점수 제외(기록만)
                 horizons: {short: {exclude: true}, mid: {exclude: true}, long: {exclude: true}}}
percentile_window: 1260    # 5년(거래일)
percentile_min_periods: 252
contrarian_band: 0.10      # 하위/상위 10% 밖에서만 신호
low_confidence_missing: 0.3
arrow_threshold: 20
ai_adjustment_cap: 10
stale_days: 5
backtest: {start: "2005-01-01", split: "2018-01-01", bucket: 20, calibration: all}   # 학습 구간에 2008 금융위기 포함
fred_series:               # series_id: 발표 지연(영업일)
  DGS10: 1
  DGS2: 1       # 2년물: 금리 인상 기대
  T10YIE: 1     # 10년 기대인플레이션
  T10Y2Y: 1
  BAMLH0A0HYM2: 1
  NFCI: 5
  SAHMREALTIME: 25
zone: {entry: 20, exit: -20}   # 매수 구간: 중기 점수 ≥ entry 진입, < exit 청산 (학습 2005~17에서 선택)
kakao: {redirect_uri: "http://localhost:5000/callback", link_url: "https://finance.yahoo.com/quote/%5ENDX", send_reasons: false, page_url: "https://index-report-ten.vercel.app/#"}   # 근거(단기적·중기적)는 웹에서만
paths: {state: "state", calibration: "model/calibration.json", history: "model/history.csv", dashboard: "state/dashboard.html", publish: "public/index.html", tokens: "state/kakao_tokens.json", tokens_enc: "model/kakao_tokens.enc", logs: "state/logs"}   # model/·public/ 은 저장소에 커밋 (클라우드 실행용)
